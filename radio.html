    /* تنسيق عام للصفحة */

    }

      margin: 16px 0;
    }

      padding: 8px;
      width: 80%;
      max-width: 500px;
      font-size: 16px;
      box-sizing: border-box;
    }

    /* مشغل الصوت */
    #currentAudio {
      width: 100%;
      padding: 8px 0;
      box-sizing: border-box;
    }

    /* أزرار التحكم العامة */
    .control-button {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      margin: 5px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      color: #0033cc;
      background-color: #f0f0f0;
      transition: background-color 0.3s ease, opacity 0.3s ease;
    }

    .control-button:hover {
      opacity: 0.7;
      background-color: #e0e0e0;
    }

    .control-button.active {
      background-color: #007a3d;
      color: #fff;
    }

    /* التشغيل التلقائي */
    .auto-play-container {
      margin: 16px 0;
    }

    .duration-input {
      width: 50px;
      margin: 0 6px;
    }

    /* قائمة المحطات */
    #stationsList {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }

    .station {
      display: flex;
      align-items: stretch;
      gap: 6px;
    }

    /* زر المحطة */
    .station-button {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 56px;
      min-height: 52px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 5px;
      background: linear-gradient(to bottom, #000000 30%, #ffffff 60%, #007a3d 100%);
      font-family: inherit;
      transition: opacity 0.3s ease, border-color 0.3s ease;
    }

    .station-button:hover {
      opacity: 0.85;
    }

    .station-button.selected {
      border-color: #ffd400;
      box-shadow: 0 0 8px #ffd400;
    }

    /* علم فلسطين */
    .flag {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 38px;
      object-fit: cover;
      border-radius: 3px;
    }

    .station-name {
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.5;
      text-shadow: 0 0 3px #000;
    }

    .station-name-en {
      color: #000;
      font-size: 13px;
      line-height: 1.4;
    }

    /* زر المفضلة */
    .favorite-button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 26px;
      color: gray;
      padding: 0 8px;
      transition: color 0.3s;
    }

    .favorite-button.selected {
      color: red;
    }

    .no-results {
      margin: 20px 0;
      color: #555;
    }

      { ar: 'ترجمة معاني القرآن باللغة الألمانية', en: 'Übersetzung der Bedeutungen des Korans ins Deutsche', url: 'https://qurango.net/radio/translation_quran_german' },
      { ar: 'ترجمة معاني القرآن باللغة الروسية', en: 'Перевод смыслов Корана на русский язык', url: 'https://backup.qurango.net/radio/translation_quran_Russia' },

      { ar: 'المختصر في تفسير القرآن الكريم باللغة القيرقيزية', en: 'Кыскача Курандын түшүндүрмөсү', url: 'https://backup.qurango.net/radio/mokhtasr-grgstan' },
      { ar: 'المختصر في تفسير القرآن الكريم باللغة الهوساوية', en: 'Takaitaccen Tafsirin Al-Qur\'an a Hausa', url: 'https://backup.qurango.net/radio/mokhtasr-husa' }
    ];

    var DEFAULT_STATION_URL = 'https://backup.qurango.net/radio/mahmoud_khalil_alhussary';
    var MAX_RETRIES = 3;

    var audio = document.getElementById('currentAudio');
    var statusDiv = document.getElementById('status');
    var listDiv = document.getElementById('stationsList');
    var noResultsDiv = document.getElementById('noResults');
    var searchInput = document.getElementById('searchInput');
    var autoPlayCheckbox = document.getElementById('autoPlayCheckbox');
    var durationInput = document.getElementById('durationInput');
    var favoritesFilterButton = document.getElementById('favoritesFilterButton');

    var currentIndex = -1;
    var autoPlayInterval = null;
    var retryCount = 0;
    var retryTimer = null;
    var showFavoritesOnly = false;
    var favorites = loadFavorites();

    // قراءة المفضلة من التخزين المحلي
    function loadFavorites() {
      try {
        return JSON.parse(localStorage.getItem('radioFavorites')) || [];
      } catch (e) {
        return [];
      }
    }

    // حفظ المفضلة في التخزين المحلي
    function saveFavorites() {
      try {
        localStorage.setItem('radioFavorites', JSON.stringify(favorites));
      } catch (e) {
        // تجاهل الخطأ إذا كان التخزين غير متاح
      }
    }

    // توحيد النص العربي لتسهيل البحث (الهمزات، الياء، التاء المربوطة، التشكيل)
    function normalize(text) {
      return text
        .toLowerCase()
        .replace(/[\u064B-\u0652\u0640]/g, '')
        .replace(/[أإآ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه');
    }

    // تحديث رسالة الحالة
    function updateStatus(message) {
      statusDiv.textContent = message;
    }

    // بناء قائمة المحطات
    function buildList() {
      stations.forEach(function (station, index) {
        var row = document.createElement('div');
        row.className = 'station';
        row.dataset.index = index;
        row.dataset.search = normalize(station.ar + ' ' + station.en);

        var playBtn = document.createElement('button');
        playBtn.className = 'station-button';
        playBtn.addEventListener('click', function () {
          playStation(index);
        });

        var flag = document.createElement('img');
        flag.className = 'flag';
        flag.src = FLAG_URL;
        flag.alt = 'علم فلسطين';

        var nameAr = document.createElement('span');
        nameAr.className = 'station-name';
        nameAr.textContent = station.ar;

        var nameEn = document.createElement('span');
        nameEn.className = 'station-name-en';
        nameEn.textContent = station.en;

        playBtn.appendChild(flag);
        playBtn.appendChild(nameAr);
        playBtn.appendChild(nameEn);

        var favBtn = document.createElement('button');
        favBtn.className = 'favorite-button';
        favBtn.textContent = '❤';
        favBtn.title = 'إضافة إلى المفضلة';
        if (favorites.indexOf(station.url) !== -1) {
          favBtn.classList.add('selected');
        }
        favBtn.addEventListener('click', function () {
          toggleFavorite(favBtn, station.url);
        });

        row.appendChild(playBtn);
        row.appendChild(favBtn);
        listDiv.appendChild(row);
      });
    }

    // إضافة المحطة إلى المفضلة أو إزالتها منها
    function toggleFavorite(button, url) {
      var pos = favorites.indexOf(url);
      if (pos === -1) {
        favorites.push(url);
        button.classList.add('selected');
      } else {
        favorites.splice(pos, 1);
        button.classList.remove('selected');
      }
      saveFavorites();
      applyFilters();
    }

    // تطبيق البحث وفلتر المفضلة
    function applyFilters() {
      var query = normalize(searchInput.value.trim());
      var visibleCount = 0;
      Array.prototype.forEach.call(listDiv.children, function (row) {
        var station = stations[row.dataset.index];
        var matchesSearch = row.dataset.search.indexOf(query) !== -1;
        var matchesFavorite = !showFavoritesOnly || favorites.indexOf(station.url) !== -1;
        var visible = matchesSearch && matchesFavorite;
        row.style.display = visible ? 'flex' : 'none';
        if (visible) {
          visibleCount++;
        }
      });
      noResultsDiv.style.display = visibleCount === 0 ? 'block' : 'none';
    }

    // تمييز المحطة الحالية
    function updateSelected() {
      Array.prototype.forEach.call(listDiv.children, function (row) {
        var btn = row.querySelector('.station-button');
        btn.classList.toggle('selected', Number(row.dataset.index) === currentIndex);
      });
    }

    // تشغيل محطة محددة
    function playStation(index) {
      clearTimeout(retryTimer);
      retryCount = 0;
      currentIndex = index;
      var station = stations[index];
      audio.src = station.url;
      var promise = audio.play();
      if (promise !== undefined) {
        promise.catch(function () {
          // قد يمنع المتصفح التشغيل التلقائي قبل تفاعل المستخدم
          updateStatus('اضغط زر التشغيل لبدء: ' + station.ar);
        });
      }
      updateStatus('تشغيل: ' + station.ar);
      updateSelected();
    }

    // المحطات الظاهرة حاليًا (بعد البحث والفلترة) بحسب الترتيب
    function visibleIndexes() {
      var result = [];
      Array.prototype.forEach.call(listDiv.children, function (row) {
        if (row.style.display !== 'none') {
          result.push(Number(row.dataset.index));
        }
      });
      return result;
    }

    // الانتقال خطوة داخل المحطات الظاهرة (1 للتالية، -1 للسابقة)
    function step(direction) {
      var list = visibleIndexes();
      if (list.length === 0) {
        return;
      }
      var pos = list.indexOf(currentIndex);
      if (pos === -1) {
        pos = direction > 0 ? -1 : 0;
      }
      var nextPos = (pos + direction + list.length) % list.length;
      playStation(list[nextPos]);
    }

    // اختيار محطة عشوائية مختلفة عن الحالية
    function playRandom() {
      var list = visibleIndexes();
      if (list.length === 0) {
        return;
      }
      var candidates = list.filter(function (i) { return i !== currentIndex; });
      if (candidates.length === 0) {
        candidates = list;
      }
      playStation(candidates[Math.floor(Math.random() * candidates.length)]);
    }

    // التبديل التلقائي بين المحطات
    function startAutoPlay() {
      stopAutoPlay();
      var minutes = parseInt(durationInput.value, 10);
      if (isNaN(minutes) || minutes < 1) {
        minutes = 1;
        durationInput.value = 1;
      }
      autoPlayInterval = setInterval(function () {
        step(1);
      }, minutes * 60 * 1000);
    }

    function stopAutoPlay() {
      clearInterval(autoPlayInterval);
      autoPlayInterval = null;
    }

    // ربط الأحداث
    document.getElementById('prevButton').addEventListener('click', function () { step(-1); });
    document.getElementById('nextButton').addEventListener('click', function () { step(1); });
    document.getElementById('randomButton').addEventListener('click', playRandom);

    autoPlayCheckbox.addEventListener('change', function () {
      if (this.checked) {
        startAutoPlay();
      } else {
        stopAutoPlay();
      }
    });

    durationInput.addEventListener('change', function () {
      if (autoPlayCheckbox.checked) {
        startAutoPlay();
      }
    });

    favoritesFilterButton.addEventListener('click', function () {
      showFavoritesOnly = !showFavoritesOnly;
      this.classList.toggle('active', showFavoritesOnly);
      applyFilters();
    });

    searchInput.addEventListener('input', applyFilters);

    // عند انتهاء البث، يُعاد تشغيل المحطة نفسها
    audio.addEventListener('ended', function () {
      if (currentIndex !== -1) {
        audio.load();
        audio.play().catch(function () {});
      }
    });

    // عند حدوث خطأ، تُعاد المحاولة عدة مرات ثم تظهر رسالة
    audio.addEventListener('error', function () {
      if (currentIndex === -1) {
        return;
      }
      if (retryCount >= MAX_RETRIES) {
        updateStatus('تعذر تشغيل هذه المحطة، يُرجى اختيار محطة أخرى.');
        return;
      }
      retryCount++;
      updateStatus('حدث خطأ، جارٍ إعادة المحاولة (' + retryCount + '/' + MAX_RETRIES + ')…');
      clearTimeout(retryTimer);
      retryTimer = setTimeout(function () {
        audio.src = stations[currentIndex].url;
        audio.play().catch(function () {});
      }, 5000);
    });

    // تشغيل المحطة الافتراضية عند تحميل الصفحة
    window.addEventListener('load', function () {
      buildList();
      var defaultIndex = stations.findIndex(function (s) { return s.url === DEFAULT_STATION_URL; });
      playStation(defaultIndex === -1 ? 0 : defaultIndex);
    });
  </script>
