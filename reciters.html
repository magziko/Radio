        ];

        var currentAudio = document.getElementById('currentAudio');
        var currentTrack = document.getElementById('currentTrack');
        var MAX_RETRIES = 3;       // عدد محاولات المحطة ذات الرابط الواحد
        var LOAD_TIMEOUT = 12000;  // مهلة بدء البث بالمللي ثانية
        var retryTimeout;
        var loadTimeout;
        var stopCheckInterval;
        var stoppedTime = 0; // لتتبع مدة التوقف
        var currentStation = null;
        var urlIndex = 0;     // ترتيب الرابط الحالي للمحطات متعددة الروابط
        var failCount = 0;
        var attemptId = 0;
        var attemptHandled = false;

        // روابط المحطة: قائمة (للمحطات ذات البدائل) أو رابط واحد
        function getUrls(station) {
            return station.urls && station.urls.length ? station.urls : [station.url];
        }

        // تشغيل محطة جديدة من البداية
        function playStation(station) {
            clearTimeout(retryTimeout); // إلغاء أي مؤقت سابق
            clearInterval(stopCheckInterval); // إلغاء أي فحص توقف سابق
            currentStation = station;
            urlIndex = 0;
            failCount = 0;
            startCurrent();
        }

        // تشغيل الرابط الحالي للمحطة الحالية
        function startCurrent() {
            clearTimeout(retryTimeout);
            clearTimeout(loadTimeout);
            attemptId++;
            attemptHandled = false;
            var myAttempt = attemptId;
            var station = currentStation;

            currentAudio.src = getUrls(station)[urlIndex];
            currentTrack.textContent = 'جارٍ التحميل: ' + station.ar;
            // إذا لم يبدأ البث خلال المهلة نعتبر المحاولة فاشلة وننتقل للبديل
            loadTimeout = setTimeout(function () { handleFailure(myAttempt); }, LOAD_TIMEOUT);

            currentAudio.play().then(function () {
                if (myAttempt !== attemptId) {
                    return;
                }
                clearTimeout(loadTimeout);
                currentTrack.textContent = 'الآن تشغيل: ' + station.ar; // تحديث الحالة
                startStopCheck(); // بدء فحص التوقف
            }).catch(function (error) {
                if (myAttempt !== attemptId) {
                    return; // تم استبدال هذه المحاولة بمحاولة أحدث
                }
                if (error && error.name === 'NotAllowedError') {
                    // المتصفح يمنع التشغيل التلقائي قبل أي تفاعل: ننتظر أول نقرة أو لمسة
                    clearTimeout(loadTimeout);
                    currentTrack.textContent = 'المحطة جاهزة، اضغط في أي مكان لبدء: ' + station.ar;
                    startOnFirstInteraction();
                    return;
                }
                if (error && error.name === 'AbortError') {
                    return;
                }
                console.log('فشل في التشغيل:', error);
                handleFailure(myAttempt);
            });
        }

        // معالجة فشل التشغيل: الانتقال للرابط البديل أو إعادة المحاولة
        function handleFailure(id) {
            if (id !== attemptId || attemptHandled || !currentStation) {
                return;
            }
            attemptHandled = true;
            clearTimeout(loadTimeout);
            var urls = getUrls(currentStation);
            failCount++;

            if (urls.length > 1) {
                if (failCount >= urls.length) {
                    currentTrack.textContent = 'تعذر تشغيل هذه المحطة، يُرجى اختيار محطة أخرى.';
                    return;
                }
                urlIndex = (urlIndex + 1) % urls.length; // الرابط البديل التالي
                startCurrent();
                return;
            }

            if (failCount >= MAX_RETRIES) {
                currentTrack.textContent = 'تعذر تشغيل هذه المحطة، يُرجى اختيار محطة أخرى.';
                return;
            }
            currentTrack.textContent = 'تعذر التشغيل، جارٍ إعادة المحاولة (' + failCount + '/' + MAX_RETRIES + ')...';
            retryTimeout = setTimeout(startCurrent, 5000); // إعادة المحاولة بعد 5 ثوانٍ
        }

        // عند بدء الصوت فعليًا تُصفَّر عدّادات الفشل
        currentAudio.addEventListener('playing', function () {
            clearTimeout(loadTimeout);
            failCount = 0;
        });

        // عند حدوث خطأ في المصدر الحالي
        currentAudio.addEventListener('error', function () {
            if (currentStation) {
                handleFailure(attemptId);
            }
        });

        // عند انتهاء المقطع: المحطات متعددة الملفات تنتقل للملف التالي، وغيرها تعيد الاتصال
        currentAudio.onended = function () {
            clearInterval(stopCheckInterval); // إلغاء التحقق من التوقف
            stoppedTime = 0; // إعادة تعيين الوقت
            if (!currentStation) {
                return;
            }
            var urls = getUrls(currentStation);
            if (urls.length > 1) {
                urlIndex = (urlIndex + 1) % urls.length;
                startCurrent();
                return;
            }
            retryTimeout = setTimeout(startCurrent, 5000); // إعادة المحاولة بعد 5 ثوانٍ
        };

        // بدء التحقق من التوقف
        function startStopCheck() {
            stoppedTime = 0; // إعادة تعيين مدة التوقف
            clearInterval(stopCheckInterval);
            stopCheckInterval = setInterval(function () {
                if (currentAudio.paused && !currentAudio.ended) {
                    stoppedTime += 1; // زيادة مدة التوقف كل ثانية
                    if (stoppedTime >= 30) { // إذا توقفت لمدة 30 ثانية
                        playStation(currentStation); // إعادة تشغيل المحطة الحالية نفسها
                    }
                } else {
                    stoppedTime = 0; // إعادة تعيين الوقت إذا كان البث يعمل
                }
            }, 1000); // تحقق كل ثانية
        }

        // إلغاء مؤقت الإعادة عند التشغيل اليدوي
        currentAudio.onplay = function () {
            clearTimeout(retryTimeout);
            stoppedTime = 0;
        };

        // بدء التشغيل عند أول تفاعل من المستخدم إذا منع المتصفح التشغيل التلقائي
        var interactionArmed = false;

        function startOnFirstInteraction() {
            if (interactionArmed) {
                return;
            }
            interactionArmed = true;

            function handler(event) {
                document.removeEventListener('pointerdown', handler, true);
                document.removeEventListener('keydown', handler, true);
                interactionArmed = false;
                // إذا ضغط المستخدم على زر محطة فهو يتولى التشغيل بنفسه
                if (event.target && event.target.closest && event.target.closest('.button')) {
                    return;
                }
                if (currentStation) {
                    playStation(currentStation);
                }
            }

            document.addEventListener('pointerdown', handler, true);
            document.addEventListener('keydown', handler, true);
        }

        // بناء أزرار المحطات
        function buildButtons() {
            var list = document.getElementById('stationsList');
            stations.forEach(function (station) {
                var button = document.createElement('button');
                button.className = 'button palestine';

                var flag = document.createElement('img');
                flag.className = 'flag';
                flag.src = FLAG_URL;
                flag.alt = 'علم فلسطين';

                var nameAr = document.createElement('span');
                nameAr.className = 'button-text';
                nameAr.textContent = station.ar;

                var nameEn = document.createElement('span');
                nameEn.className = 'button-text english-text';
                nameEn.textContent = station.en;

                button.appendChild(flag);
                button.appendChild(nameAr);
                button.appendChild(nameEn);
                button.addEventListener('click', function () {
                    playStation(station);
                });
                list.appendChild(button);
            });
        }

        // بناء الأزرار وتشغيل المحطة الافتراضية عند تحميل الصفحة
        window.onload = function () {
            buildButtons();
            var def = stations.filter(function (s) { return s.url === DEFAULT_STATION_URL; })[0] || stations[0];
            playStation(def);
        };
    </script>
