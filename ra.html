 <div class="container">
    <!-- حالة الراديو -->
    <div id="status">الرجاء اختيار محطة راديو.</div>

    <!-- مشغل الصوت -->
    <audio controls autoplay id="currentAudio">
      الجهاز لا يدعم تشغيل الصوت.
    </audio>

    <!-- أزرار التبديل بين المحطات -->
    <div class="buttons-container">
      <button class="button" id="prevButton">المحطة السابقة</button>
      <button class="button" id="nextButton">المحطة التالية</button>
    </div>

    <!-- التبديل التلقائي -->
    <div class="input-group">
      <label for="autoSwitchTimer" class"autopaly"></label>
      <input type="number" id="autoSwitchTimer" min="1" placeholder="أدخل عدد الدقائق">
      <label for="autoSwitchCheckbox"> التنقل التلقائي </label>
      <input type="checkbox" id="autoSwitchCheckbox">
    </div>

    <!-- وضع النوم -->
    <div class="input-group">
      <label for="sleepTimer"> </label>
      <input type="number" id="sleepTimer" min="1" placeholder="أدخل عدد الدقائق">
      <label for="sleepCheckbox"> وضع النوم </label>
      <input type="checkbox" id="sleepCheckbox">
    </div>
  </div>
<script>
 var audio = document.getElementById('currentAudio');
    var statusDiv = document.getElementById('status');
    var currentButtonIndex = 0;
    var buttons = document.getElementsByClassName('button');
    var sleepTimeout;
    var autoSwitchTimeout;
    var autoSwitchInterval;
    var currentSource = '';

 // تشغيل محطة جديدة
    function playNewAudio(source, stationName) {
      currentSource = source;
      audio.src = source;
      audio.play();
      updateStatus("تشغيل: " + stationName);
      updateButtonColor();
    }

    // تحديث حالة العرض
    function updateStatus(message) {
      statusDiv.textContent = message;
    }

    // تمييز الزر النشط
   function updateButtonColor() {
   Array.from(buttons).forEach(button => button.classList.remove('selected'));
   buttons[currentButtonIndex].classList.add('selected');
   buttons[currentButtonIndex].style.color = 'red';
   Array.from(buttons).forEach((button, index) => {
     if (index !== currentButtonIndex) {
       button.style.color = 'black';
     }
   });
}


    // الانتقال إلى الزر التالي
    function switchToNextButton() {
      currentButtonIndex = (currentButtonIndex + 1) % buttons.length;
      buttons[currentButtonIndex].click();
    }

    // التبديل التلقائي بين المحطات
    function activateAutoSwitch() {
      if (document.getElementById('autoSwitchCheckbox').checked) {
        var autoSwitchMinutes = parseInt(document.getElementById('autoSwitchTimer').value);
        if (isNaN(autoSwitchMinutes) || autoSwitchMinutes <= 0) {
          alert("يرجى إدخال عدد دقائق صحيح.");
          document.getElementById('autoSwitchCheckbox').checked = false;
          return;
        }

        autoSwitchInterval = autoSwitchMinutes * 60 * 1000;
        autoSwitchTimeout = setTimeout(function autoSwitch() {
          switchToNextButton();
          autoSwitchTimeout = setTimeout(autoSwitch, autoSwitchInterval);
        }, autoSwitchInterval);

        alert("تم تفعيل التبديل التلقائي كل " + autoSwitchMinutes + " دقيقة.");
      } else {
        clearTimeout(autoSwitchTimeout);
        alert("تم إلغاء التبديل التلقائي.");
      }
    }

    // تفعيل وضع النوم
    function activateSleepMode() {
      if (document.getElementById('sleepCheckbox').checked) {
        var sleepMinutes = parseInt(document.getElementById('sleepTimer').value);
        if (isNaN(sleepMinutes) || sleepMinutes <= 0) {
          alert("يرجى إدخال عدد دقائق صحيح.");
          document.getElementById('sleepCheckbox').checked = false;
          return;
        }

        var sleepInterval = sleepMinutes * 60 * 1000;
        sleepTimeout = setTimeout(function() {
          audio.pause();
          updateStatus("تم إيقاف الراديو بسبب وضع النوم.");
        }, sleepInterval);

        alert("تم تفعيل وضع النوم لمدة " + sleepMinutes + " دقيقة.");
      } else {
        clearTimeout(sleepTimeout);
        alert("تم إلغاء وضع النوم.");
      }
    }

    // مراقبة وضع النوم والتبديل التلقائي
    document.getElementById('autoSwitchCheckbox').addEventListener('change', activateAutoSwitch);
    document.getElementById('sleepCheckbox').addEventListener('change', activateSleepMode);

    // زر المحطة السابقة
    document.getElementById('prevButton').addEventListener('click', function() {
      currentButtonIndex = (currentButtonIndex - 1 + buttons.length) % buttons.length;
      buttons[currentButtonIndex].click();
    });

    // زر المحطة التالية
    document.getElementById('nextButton').addEventListener('click', function() {
      currentButtonIndex = (currentButtonIndex + 1) % buttons.length;
      buttons[currentButtonIndex].click();
    });

    // تهيئة الصفحة وتشغيل محطة افتراضية
    window.onload = function() {
      buttons = document.querySelectorAll('.button:not(#prevButton):not(#nextButton)');
      playNewAudio('https://islamicbulletin.site:8108/stream', "إذاعة القرآن الكريم نابلس ❤️ فلسطين");
    }
</script>

<script>
  var radioPlayer = document.getElementById('radioPlayer');
  var radioDisplay = document.getElementById('radioDisplay');

  function playStation(stationUrl) {
    radioPlayer.src = stationUrl;
    radioPlayer.play();
    radioDisplay.textContent = "تشغيل المحطة: " + stationUrl;
  }

  function stopRadio() {
    radioPlayer.pause();
    radioPlayer.src = "";
    radioDisplay.textContent = "تم إيقاف الراديو";
  }
</script>
